[project]
authors = [{ name = "saschahofmann", email = "sascha.kelevra@gmail.com" }]
dependencies = []
name = "indicator-delta-scaling"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
indicator_delta_scaling = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
xarray = ">=2026.4.0,<2027"

[tool.pixi.feature.dev.dependencies]
xsdba = "*"
jupyter = ">=1.1.1,<2"

[tool.pixi.environments]
default = ["dev"]

[dependency-groups]
dev = ["ibicus>=1.2.0,<2"]
